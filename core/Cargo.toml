[package]
name = "escrow_core"
version = "0.1.0"
edition = "2021"
description = "Pure, chain-independent rules for the AgentEscrow contract: rubric validation, panel-verdict parsing, median scoring, appeal averaging and the job state machine"
license = "MIT"

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
